<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada — CAP Consultor</title>
  <meta name="robots" content="noindex">
  
  
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 520px; }
    .code {
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #00e599;
      margin: 0 0 20px;
    }
    h1 {
      font-size: 32px;
      line-height: 1.2;
      letter-spacing: -.02em;
      margin: 0 0 16px;
      font-weight: 500;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      color: rgba(255, 255, 255, .55);
      margin: 0 0 32px;
    }
    a.button {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 999px;
      background: #fff;
      color: #000;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: background .2s;
    }
    a.button:hover { background: rgba(255, 255, 255, .8); }
  </style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png"><link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><style data-cap-mobile-fix="1">
/* --- Mobile: no horizontal scroll, no zoom-out ---------------------------
   overflow-x must be on BOTH html and body. With it only on body, the
   browser propagates the overflow to the viewport and widens the layout
   viewport instead of clipping (that is what let the page drag sideways
   and render zoomed out).
   `clip` rather than `hidden`: `hidden` makes a scroll container, which
   would break the sticky header. `clip` just cuts, with a fallback for
   older engines. */
html{overflow-x:hidden;overflow-x:clip}
body{overflow-x:hidden!important;overflow-x:clip!important;max-width:100%}
.logos,.logos-animated{max-width:100%;overflow-x:clip}
img,svg,video,canvas,iframe{max-width:100%}
</style><meta property="og:locale" content="es_ES"><link rel="stylesheet" href="assets/css/cap-i18n.css"></head>
<body>
  <div class="wrap">
    <p class="code">Error 404</p>
    <h1>No hemos encontrado esa página</h1>
    <p>La página que buscabas no existe o se ha movido a otro sitio.</p>
    <a class="button" href="/">Volver al inicio</a>
  </div>
<script src="assets/js/cap-i18n.js" defer></script></body>
</html>
