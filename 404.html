<!DOCTYPE html>
<html lang="es-ES">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada · CAP Consultor</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root{--blue:#1E0FB5;--ink:#0E0E1A;--ink-60:#4A4A5C;--line:#E6E4F0;--bg-soft:#F9F8FD}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:#fff;line-height:1.65;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  a{color:var(--blue)}
  header{border-bottom:1px solid var(--line)}
  header .wrap{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:16px 22px}
  header img{width:34px;height:34px;border-radius:6px}
  header strong{font-size:16px;letter-spacing:-.01em}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 22px;text-align:center}
  h1{font-size:clamp(28px,5vw,40px);letter-spacing:-.02em;margin-bottom:12px}
  p{color:var(--ink-60);margin-bottom:24px}
  .links a{display:inline-block;margin:0 10px;font-weight:600}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <img src="/favicon.png" alt="Logo CAP Consultor">
    <strong>CAP Consultor</strong>
  </div>
</header>
<main>
  <div>
    <h1>Página no encontrada</h1>
    <p>La página que buscas no existe o se ha movido.</p>
    <div class="links">
      <a href="/">Inicio</a>
      <a href="/blog.html">Blog</a>
      <a href="/#contacto">Contacto</a>
    </div>
  </div>
</main>
</body>
</html>
