<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — CAP Consultor</title>
  <meta name="robots" content="noindex">
  
  
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 520px; }
    .code {
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #00e599;
      margin: 0 0 20px;
    }
    h1 {
      font-size: 32px;
      line-height: 1.2;
      letter-spacing: -.02em;
      margin: 0 0 16px;
      font-weight: 500;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      color: rgba(255, 255, 255, .55);
      margin: 0 0 32px;
    }
    a.button {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 999px;
      background: #fff;
      color: #000;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: background .2s;
    }
    a.button:hover { background: rgba(255, 255, 255, .8); }
  </style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png"></head>
<body>
  <div class="wrap">
    <p class="code">Error 404</p>
    <h1>We couldn't find that page</h1>
    <p>The page you were looking for doesn't exist, or it has moved somewhere else.</p>
    <a class="button" href="/">Back to home</a>
  </div>
</body>
</html>
